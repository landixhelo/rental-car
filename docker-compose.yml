services:
  db:
    image: postgres:16-alpine
    container_name: autorent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autorent
      POSTGRES_PASSWORD: autorent_secure_pass
      POSTGRES_DB: autorent
    ports:
      - "5432:5432"
    volumes:
      - autorent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorent -d autorent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autorent_pg_data:

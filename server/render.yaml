services:
  - type: web
    name: autorent-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npx prisma db push && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autorent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: AutoRent Admin
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: UPLOAD_DIR
        value: uploads

databases:
  - name: autorent-db
    plan: free
